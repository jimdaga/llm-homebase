# docker-compose.yml — Local LiteLLM proxy stack
# Usage: podman-compose up -d   (or: docker compose up -d)
#
# NOTE: LiteLLM requires PostgreSQL for virtual keys and spend tracking.
# SQLite is not supported in recent LiteLLM versions.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    volumes:
      # Persist the database across container restarts
      - ./data/postgres:/var/lib/postgresql/data:Z
      # Mount scripts for execution
      - ./scripts:/scripts:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  litellm:
    # Pinned to the digest of main-latest as of 2026-08-07 (LiteLLM 1.97.0)
    # To upgrade: pull main-latest, verify it works, then update this digest.
    #   podman pull ghcr.io/berriai/litellm:main-latest
    #   podman inspect ghcr.io/berriai/litellm:main-latest --format '{{.Digest}}'
    image: ghcr.io/berriai/litellm@sha256:e0ac5d76ead293c1505587985c8d4360647118cf30d8005963a8f1225ee4d631
    ports:
      - "4000:4000"
    volumes:
      # LiteLLM proxy config
      - ./config.yaml:/app/config.yaml:ro,Z
      # Google Application Default Credentials (read-only).
      # Mount the directory (not the file) so re-running
      # `gcloud auth application-default login` is picked up without
      # a container restart — gcloud atomically replaces the file,
      # which breaks single-file bind mounts.
      - ${HOME}/.config/gcloud:/gcp/gcloud:ro,Z
      # Proactive token refresh callback (see scripts/vertex_proactive_refresh.py)
      - ./scripts/vertex_proactive_refresh.py:/app/scripts/vertex_proactive_refresh.py:ro,Z
      # Routing logger callback (see scripts/routing_logger.py)
      - ./scripts/routing_logger.py:/app/scripts/routing_logger.py:ro,Z
      # root CA for models corp
      - ./internal-root-ca.pem:/app/internal-root-ca.pem:ro,Z
    # Load VERTEX_*, LITELLM_MASTER_KEY, MODELS_CORP_* straight from the .env
    # file into the container. Deliberately NOT using `environment: KEY:
    # ${KEY}` interpolation for these — that reads from the *host shell's*
    # exported env first and only falls back to .env, so a stale exported var
    # in your terminal (e.g. from an old `source .env`) silently overrides a
    # correct, freshly-edited .env on every `up`/restart. env_file reads the
    # file directly, independent of whatever's exported in your shell.
    env_file:
      - path: .env
        required: false
    environment:
      # Vertex AI auth via ADC
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/gcloud/application_default_credentials.json
      # PostgreSQL connection string (matches postgres service above)
      DATABASE_URL: "postgresql://litellm:litellm@postgres:5432/litellm"
      # Defaults for Models.corp — overridden by .env when set.
      # Prevents LiteLLM crash on startup when vars are absent.
      MODELS_CORP_PROVIDER_MODEL_ID: ${MODELS_CORP_PROVIDER_MODEL_ID:-openai/ibm-granite/granite-3.3-8b-instruct}
      MODELS_CORP_BASE_URL: ${MODELS_CORP_BASE_URL:-}
      MODELS_CORP_API_KEY: ${MODELS_CORP_API_KEY:-}
      # Route the "openai/" provider through litellm's newer unified HTTP
      # handler instead of the OpenAI-SDK-based one. Needed so the per-model
      # `ssl_verify` in litellm_params (see granite-free in config.yaml)
      # actually gets applied to the TLS handshake — the default handler
      # silently ignores it and only honors litellm.ssl_verify globally.
      # Does not affect vertex_ai/claude models (different code path).
      EXPERIMENTAL_OPENAI_BASE_LLM_HTTP_HANDLER: "true"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /health requires auth; / returns 200 without credentials
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
