# config.yaml — LiteLLM Proxy configuration
# Docs: https://docs.litellm.ai/docs/proxy/configs

model_list:
  # ──────────────────────────────────────────────
  # TIER 0 — Ultra: Claude Opus via Vertex AI
  # ──────────────────────────────────────────────
  - model_name: claude-opus
    litellm_params:
      model: vertex_ai/claude-opus-4-6
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION

  # ──────────────────────────────────────────────
  # TIER 1 — Premium: Claude Sonnet via Vertex AI
  # ──────────────────────────────────────────────
  - model_name: claude-sonnet
    litellm_params:
      model: vertex_ai/claude-sonnet-4-5
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION

  # ──────────────────────────────────────────────
  # TIER 2 — Standard: Claude Haiku via Vertex AI
  # ──────────────────────────────────────────────
  - model_name: claude-haiku
    litellm_params:
      model: vertex_ai/claude-haiku-4-5
      vertex_project: os.environ/VERTEX_PROJECT
      vertex_location: os.environ/VERTEX_LOCATION

  # ──────────────────────────────────────────────
  # TIER 3 — Free: IBM Granite via Models.corp (Red Hat internal)
  # PLACEHOLDER — non-functional until MODELS_CORP_* vars are configured in
  # .env and internal-root-ca.pem is present. See README "Adding Models.corp".
  # ──────────────────────────────────────────────
  - model_name: granite-free
    litellm_params:
      model: os.environ/MODELS_CORP_PROVIDER_MODEL_ID
      api_base: os.environ/MODELS_CORP_BASE_URL
      api_key: os.environ/MODELS_CORP_API_KEY
      ssl_verify: /app/internal-root-ca.pem

  # ──────────────────────────────────────────────
  # AUTO-ROUTER — Complexity-based routing (BETA, requires LiteLLM v1.94.x+)
  # Classifies each request with a heuristic scorer (zero latency, no API calls)
  # and routes to the cheapest model adequate for the complexity:
  #
  #   SIMPLE    → claude-haiku   (greetings, "what is X", short prompts)
  #   MEDIUM    → claude-sonnet  (general coding, explanations)
  #   COMPLEX   → claude-sonnet  (no mid-tier; sonnet handles complex well)
  #   REASONING → claude-opus    (architecture, multi-step, hard debugging)
  #
  # Use "claude-auto" as the model name in OpenCode — the name must contain
  # "claude" for Claude clients to accept it.
  # ──────────────────────────────────────────────
  - model_name: claude-auto
    litellm_params:
      model: auto_router/complexity_router
      complexity_router_default_model: claude-sonnet
      complexity_router_config:
        tiers:
          SIMPLE:    claude-haiku
          MEDIUM:    claude-sonnet
          COMPLEX:   claude-sonnet  # Intentional: sonnet handles complex well;
                                    # opus reserved for true multi-step reasoning
          REASONING: claude-opus
        # Escalate to REASONING tier on these keywords, even for simple questions.
        # Trade-off: "what is kubernetes?" routes to Opus instead of Haiku.
        # Acceptable for this workload — infrastructure questions deserve the best model.
        custom_technical_keywords:
          - kubernetes
          - k8s
          - terraform
          - openshift
          - hypershift
          - gke
          - vertex
          - postgresql
          - redis
          - kafka
          - architecture
          - distributed
          - concurrency
    model_info:
      # auto_router/complexity_router is a proxy-side meta-router with no real
      # completion handler — litellm.ahealth_check() 400s on it ("Unmapped LLM
      # provider"). litellm's skip logic for auto_router health checks only
      # covers semantic auto_router, not complexity_router. Skip it here;
      # the real tier models (claude-opus/sonnet/haiku) are health-checked
      # individually anyway, so nothing is actually left unchecked.
      disable_background_health_check: true

  # ──────────────────────────────────────────────
  # PLACEHOLDER — Gemini via Vertex AI
  # Uncomment and set model variant when ready
  # ──────────────────────────────────────────────
  # - model_name: gemini-pro
  #   litellm_params:
  #     model: vertex_ai/gemini-2.0-flash-001
  #     vertex_project: os.environ/VERTEX_PROJECT
  #     vertex_location: os.environ/VERTEX_LOCATION

router_settings:
  # Retry on provider errors (not budget fallbacks — those are key-level)
  num_retries: 2
  retry_after: 5

  # If a model hits its context window limit, fall back to the next tier
  # rather than returning an error to the client.
  context_window_fallbacks:
    - claude-opus:   ["claude-sonnet"]
    - claude-sonnet: ["claude-haiku"]
    - claude-haiku:  ["granite-free"]
    - claude-auto:   ["claude-sonnet", "claude-haiku"]

litellm_settings:
  # Drop unsupported params silently rather than erroring — some Vertex
  # models don't support every OpenAI field (e.g. logprobs, user).
  drop_params: true

  # Abort requests that haven't completed within 5 minutes. Prevents
  # hung requests from blocking the proxy indefinitely.
  request_timeout: 300

  # Disk-based response cache — survives proxy restarts, zero extra
  # containers. Identical requests (same model + messages) return the
  # cached response at no cost.
  #
  # Note: LiteLLM caches on exact message match. OpenCode adds a unique
  # session ID to each request, so most real sessions won't hit this cache.
  # It's most useful for the test_qos.py script and any tooling that
  # sends repeated identical prompts.
  cache: true
  cache_params:
    type: local
    ttl: 3600  # Cache responses for 1 hour (resets on proxy restart)

general_settings:
  # Database URL is set via DATABASE_URL env var in docker-compose.yml
  # (PostgreSQL required — LiteLLM dropped SQLite support in recent versions)

  # Extend model_info.disable_background_health_check to the on-demand
  # GET /health endpoint too (not just the scheduled background loop).
  # Needed so claude-auto (auto_router/complexity_router) isn't probed
  # directly — it has no real completion handler to health-check.
  health_check_skip_disabled_background_models: true

  # Master key secures the /key/generate and /spend admin endpoints
  master_key: os.environ/LITELLM_MASTER_KEY

  # Store spend data so budget tracking survives restarts
  store_model_in_db: true

  # Store request/response details so prompt data is viewable in the UI
  store_prompts_in_spend_logs: true
